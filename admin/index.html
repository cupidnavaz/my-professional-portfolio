<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Admin login</title><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head>
<body class="login"><form id="f" class="login-card" autocomplete="on">
<h1>Admin <span>login</span></h1><p class="sub">Sign in to manage your site.</p>
<label>Email<input id="e" type="email" required autocomplete="username"></label>
<label>Password<input id="p" type="password" required autocomplete="current-password"></label>
<p id="m" class="msg" role="alert"></p><button class="btn" id="b">Sign in</button><a class="back" href="../index.html">← Back to site</a></form>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><script src="../config.js"></script>
<script>
var m=document.getElementById('m');
if(typeof SUPABASE_URL==='undefined'||SUPABASE_URL.indexOf('YOUR_PROJECT')>-1){m.textContent='Set SUPABASE_URL and SUPABASE_ANON_KEY in config.js first.';}
else{
 var sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
 if(location.search.indexOf('denied')>-1) m.textContent='That account is not an admin.';
 sb.auth.getSession().then(function(r){ if(r.data.session) location.replace('dashboard.html'); });
 document.getElementById('f').onsubmit=async function(ev){
  ev.preventDefault(); var b=document.getElementById('b'); b.disabled=true; m.textContent='';
  var r=await sb.auth.signInWithPassword({email:document.getElementById('e').value.trim(),password:document.getElementById('p').value});
  if(r.error){m.textContent='Invalid email or password.';b.disabled=false;return;}
  var a=await sb.rpc('is_admin');
  if(!a.data){await sb.auth.signOut();m.textContent='That account is not an admin.';b.disabled=false;return;}
  location.replace('dashboard.html');
 };
}
</script></body></html>
